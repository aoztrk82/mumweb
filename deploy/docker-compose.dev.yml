# Local development stack: Mumble server + mumweb gateway.
# Usage: cp deploy/.env.example deploy/.env && make dev
name: mumweb-dev

services:
  mumble:
    image: mumblevoip/mumble-server:latest
    restart: unless-stopped
    ports:
      - "${MUMBLE_PORT:-64738}:64738/tcp"
      - "${MUMBLE_PORT:-64738}:64738/udp"
    environment:
      MUMBLE_SUPERUSER_PASSWORD: ${MUMBLE_SUPERUSER_PASSWORD:?set MUMBLE_SUPERUSER_PASSWORD in deploy/.env}
      # All browser users reach Mumble from the gateway's single IP. With the default
      # autoban (10 connections / 120 s, successful ones included) a handful of web
      # logins would ban the gateway for 5 minutes. Count only failed attempts.
      MUMBLE_CONFIG_AUTOBAN_SUCCESSFUL_CONNECTIONS: "false"
    volumes:
      - mumble-data:/data

  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - mumble
    ports:
      - "8080:8080"
    environment:
      MUMWEB_LISTEN: ":8080"
      MUMWEB_ALLOW_SUPERUSER: "true"

volumes:
  mumble-data:
