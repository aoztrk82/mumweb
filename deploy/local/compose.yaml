# Local HTTPS test environment: Mumble + mumweb + Caddy with an mkcert certificate.
# Works with Docker Desktop on Windows/macOS and Docker on Linux.
#
#   1. mkcert -cert-file certs/cert.pem -key-file certs/key.pem mumweb.test localhost 127.0.0.1 ::1
#   2. hosts file: 127.0.0.1 mumweb.test
#   3. docker compose up -d --build   (in this directory)
#   4. https://mumweb.test
#
# Full guide: docs/DEVELOPMENT.md. Optional settings: copy .env.example to .env.
name: mumweb-local

services:
  # One-shot: copies the mkcert files into a volume owned by the Mumble server's user
  # (uid 10000). mkcert writes key.pem with mode 600, which the server could not read
  # through a bind mount on Linux/macOS.
  certs:
    image: alpine:3.24
    restart: "no"
    volumes:
      - ./certs:/src:ro
      - mumble-certs:/out
    command:
      - sh
      - -c
      - |
        if [ ! -f /src/cert.pem ] || [ ! -f /src/key.pem ]; then
          echo "ERROR: deploy/local/certs/cert.pem and key.pem not found. See the mkcert step in docs/DEVELOPMENT.md (3.2)." >&2
          exit 1
        fi
        cp /src/cert.pem /src/key.pem /out/ && chown 10000:10000 /out/*.pem && chmod 644 /out/cert.pem && chmod 600 /out/key.pem
        echo "certificates ready"

  mumble:
    image: mumblevoip/mumble-server:latest
    restart: unless-stopped
    ports:
      # Desktop Mumble clients: mumweb.test:64738
      - "${MUMBLE_PORT:-64738}:64738/tcp"
      - "${MUMBLE_PORT:-64738}:64738/udp"
    volumes:
      - mumble-data:/data
      # Same mkcert certificate as Caddy, so desktop clients connecting to
      # mumweb.test:64738 trust the server without a prompt.
      - mumble-certs:/certs:ro
    environment:
      MUMBLE_SUPERUSER_PASSWORD: ${MUMBLE_SUPERUSER_PASSWORD:-superuser}
      MUMBLE_CONFIG_WELCOMETEXT: "mumweb local test server"
      MUMBLE_CONFIG_SSLCERT: /certs/cert.pem
      MUMBLE_CONFIG_SSLKEY: /certs/key.pem
      # All web users share the gateway's IP; don't autoban successful logins.
      MUMBLE_CONFIG_AUTOBAN_SUCCESSFUL_CONNECTIONS: "false"
    # Same hardening as the production compose.
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    networks: [default, backend]
    depends_on:
      certs:
        condition: service_completed_successfully

  mumweb:
    build:
      context: ../..
    image: mumweb:local
    restart: unless-stopped
    environment:
      MUMWEB_MUMBLE_ADDR: mumble:64738
      # The gateway ignores an explicit :443, so this also works with the default port.
      MUMWEB_ALLOWED_ORIGINS: https://${MUMWEB_DOMAIN:-mumweb.test}:${HTTPS_PORT:-443}
      MUMWEB_TRUST_PROXY: "true"
      MUMWEB_LOG_LEVEL: ${MUMWEB_LOG_LEVEL:-debug}
      MUMWEB_SERVER_NAME: ${MUMWEB_SERVER_NAME:-}
      MUMWEB_SERVER_DESCRIPTION: ${MUMWEB_SERVER_DESCRIPTION:-}
      # Local testing: allow "SuperUser" to log in from the browser (create channels etc.).
      MUMWEB_ALLOW_SUPERUSER: ${MUMWEB_ALLOW_SUPERUSER:-true}
      # Optional web access password (empty = open); handy for trying the login field.
      MUMWEB_ACCESS_PASSWORD: ${MUMWEB_ACCESS_PASSWORD:-test}
      # Admin panel at /admin (SuperUser works there even though the main UI refuses it).
      MUMWEB_ADMIN_PASSWORD: ${MUMWEB_ADMIN_PASSWORD:-admin}
      MUMWEB_MAX_SESSIONS: ${MUMWEB_MAX_SESSIONS:-50}
      MUMWEB_RESERVED_SLOTS: ${MUMWEB_RESERVED_SLOTS:-0}
      MUMWEB_RESERVED_PASSWORD: ${MUMWEB_RESERVED_PASSWORD:-}
      # Lets the admin panel's Invites tab mint links; on by default here to make it easy to try.
      MUMWEB_INVITE_SECRET: ${MUMWEB_INVITE_SECRET:-local-invite-secret}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 200
    cpus: 1.0
    networks: [backend]
    depends_on:
      - mumble

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      MUMWEB_DOMAIN: ${MUMWEB_DOMAIN:-mumweb.test}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    networks: [default, backend]
    depends_on:
      - mumweb

networks:
  backend:
    internal: true

volumes:
  mumble-data:
  mumble-certs:
  caddy-data:
  caddy-config:
